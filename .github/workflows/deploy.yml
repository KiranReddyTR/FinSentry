name: Deploy FinSentry AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web export
        run: npx expo export --platform web --output-dir docs

      - name: Fix asset paths for GitHub Pages
        run: |
          sed -i 's|href="\/favicon\.ico"|href="favicon.ico"|g' docs/index.html
          sed -i 's|src="\/_expo\/|src="_expo/|g' docs/index.html

      - name: Add 404 redirect
        run: cp docs/index.html docs/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
